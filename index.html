<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मुरबाड व्हेजी हब - Murbad Veg Hub</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 15px; text-align: center; }
        .header { background: #2e7d32; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0; font-size: 14px; opacity: 0.9; }
        .veg-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .veg-info { text-align: left; }
        .veg-name { font-size: 18px; font-weight: bold; color: #333; }
        .veg-price { font-size: 16px; color: #2e7d32; font-weight: bold; margin-top: 4px; }
        .order-btn { background: #25D366; color: white; text-decoration: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; font-size: 14px; display: inline-block; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🥦 मुरबाड व्हेजी हब 🍅</h1>
        <p>ताजी भाजी थेट शेतातून आपल्या दारी!</p>
    </div>

    <!-- भाज्यांची यादी (दर बदलण्यासाठी इथे बदल करा) -->
    <div class="veg-card">
        <div class="veg-info">
            <div class="veg-name">🍅 टोमॅटो (Tomato)</div>
            <div class="veg-price">₹२० / किलो</div>
        </div>
        <a class="order-btn" href="https://wa.me/?text=मला १ किलो टोमॅटो हवे आहेत" target="_blank">ऑर्डर करा</a>
    </div>

    <div class="veg-card">
        <div class="veg-info">
            <div class="veg-name">🧅 कांदा (Onion)</div>
            <div class="veg-price">₹३० / किलो</div>
        </div>
        <a class="order-btn" href="https://wa.me/?text=मला १ किलो कांदा हवा आहे" target="_blank">ऑर्डर करा</a>
    </div>

    <div class="veg-card">
        <div class="veg-info">
            <div class="veg-name">🥔 बटाटा (Potato)</div>
            <div class="veg-price">₹२५ / किलो</div>
        </div>
        <a class="order-btn" href="https://wa.me/?text=मला १ किलो बटाटा हवा आहे" target="_blank">ऑर्डर करा</a>
    </div>

</body>
</html>
